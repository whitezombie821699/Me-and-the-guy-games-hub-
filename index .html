<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007acc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Game Backup Library</title>
    
    <!-- PWA Manifest for Home Screen Installation -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Game Backup Library","short_name":"GameLib","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#007acc"}'>

    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #007acc;
            --border-color: #333333;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; text-align: center; }

        .toolbar { display: flex; flex-direction: column; gap: 8px; }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }

        .btn-secondary { background-color: #333333; }
        .action-row { display: flex; gap: 6px; flex-wrap: wrap; }

        .container { padding: 16px; text-align: center; flex: 1; }
        .card { background: var(--panel-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Game Backup Library (PWA)</h1>
        <div class="toolbar">
            <div class="action-row">
                <button class="btn" onclick="downloadSourceAsTxt()">💾 Export Source (.TXT)</button>
                <button class="btn btn-secondary" onclick="exportJSON()">📥 Export Data</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h3>Install as Home Screen App ("Gem")</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem;">
                Tap your mobile browser menu (three dots) and select <strong>"Add to Home screen"</strong> or <strong>"Install App"</strong> to run this offline like a native app.
            </p>
        </div>
    </div>

    <script>
        // Export the current page's HTML code as a plain .txt file
        function downloadSourceAsTxt() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: "text/plain;charset=utf-8" });
            const downloadAnchor = document.createElement("a");
            
            downloadAnchor.href = URL.createObjectURL(blob);
            downloadAnchor.download = "index_app.txt";
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(downloadAnchor.href);
        }

        function exportJSON() {
            const data = localStorage.getItem('game_backup_library') || "[]";
            const blob = new Blob([data], { type: "application/json" });
            const anchor = document.createElement("a");
            anchor.href = URL.createObjectURL(blob);
            anchor.download = "game_library_backup.json";
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>
</body>
</html>
